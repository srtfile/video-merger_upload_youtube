name: 🎬 Download & Lossless Video Joiner

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'Video URL(s) (4KPorno, HTML5, Google Drive) or links file (e.g. downloadlink.txt)'
        required: true
        type: string
        default: 'downloadlink.txt'
      batch_range:
        description: 'Batch range to process: e.g. "1 to 3", "1-3", "2-4", "1, 3", or "all"'
        required: false
        type: string
        default: 'all'
      batch_target:
        description: 'Single batch number (e.g. 1, 2, 3) or "all" (used if batch_range is "all")'
        required: false
        type: string
        default: 'all'
      output_filename:
        description: 'Default Output Filename (for single merge; grouped batches use clean group names)'
        required: true
        type: string
        default: 'merged_video.mp4'
      join_mode:
        description: 'Join Mode: auto (smart lossless copy), copy (force 100% stream copy), transcode (visually lossless)'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - copy
          - transcode
      sort_order:
        description: 'File Sorting Order'
        required: false
        type: choice
        default: 'natural'
        options:
          - natural
          - alphabetical
          - date
          - none
      batch_delay:
        description: 'Cooldown delay between batches in seconds (default: 300 / 5 mins)'
        required: false
        type: number
        default: 300
      preset:
        description: 'Transcode Speed Preset (ultrafast for maximum GitHub Actions speed; visually lossless)'
        required: false
        type: choice
        default: 'ultrafast'
        options:
          - ultrafast
          - superfast
          - veryfast
          - faster
          - fast
          - medium
          - slow
      crf:
        description: 'Transcode Quality (CRF: 17=near lossless, 20=visually lossless & 2x faster, 23=standard)'
        required: false
        type: number
        default: 20
      max_runtime:
        description: 'Safety max runtime in minutes before saving checkpoint and auto-continuing (default: 320 mins / 5 hours 20 minutes)'
        required: false
        type: number
        default: 320
      is_continuation:
        description: 'Internal: whether this run is continuing from a previous run'
        required: false
        type: boolean
        default: false
      upload_release:
        description: 'Create a GitHub Release with the merged video for direct public download?'
        required: false
        type: boolean
        default: false
      upload_youtube:
        description: 'Auto-upload merged video with timestamp chapters directly to YouTube?'
        required: false
        type: boolean
        default: false
      youtube_privacy:
        description: 'YouTube Video Privacy'
        required: false
        type: choice
        default: 'private'
        options:
          - private
          - unlisted
          - public
      youtube_title:
        description: 'Custom YouTube Video Title (Optional, defaults to output video name)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  prepare-batches:
    name: 📋 Discover & Plan Video Batches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_batches: ${{ steps.set-matrix.outputs.total_batches }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Parse Batches & Build Matrix
        id: set-matrix
        env:
          INPUT_URLS: ${{ inputs.video_urls }}
          OUTPUT_DEFAULT: ${{ inputs.output_filename }}
          BATCH_RANGE: ${{ inputs.batch_range }}
          BATCH_TARGET: ${{ inputs.batch_target }}
        run: |
          python - << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path
          from video_joiner import parse_batch_groups, parse_range_selection

          input_urls = os.environ.get("INPUT_URLS", "").strip()
          output_default = os.environ.get("OUTPUT_DEFAULT", "merged_video.mp4").strip()
          batch_range = os.environ.get("BATCH_RANGE", "").strip()
          batch_target = os.environ.get("BATCH_TARGET", "").strip()

          p = Path(input_urls)
          if p.is_file():
              groups = parse_batch_groups(p)
          else:
              groups = parse_batch_groups(input_urls)

          matrix_items = []
          if groups and (len(groups) > 1 or (len(groups) == 1 and groups[0].name != "merged_video")):
              for g in groups:
                  matrix_items.append({
                      "index": g.index,
                      "name": g.name,
                      "label": g.raw_label,
                      "output": f"{g.name}.mp4",
                      "artifact_name": f"{g.index:02d}-{g.name}",
                      "urls_count": len(g.urls),
                      "force_no_delay": False
                  })
          else:
              matrix_items.append({
                  "index": 1,
                  "name": Path(output_default).stem or "merged_video",
                  "label": "Standard Merge",
                  "output": output_default,
                  "artifact_name": Path(output_default).stem or "merged_video",
                  "urls_count": len(groups[0].urls) if groups else 0,
                  "force_no_delay": True
              })

          # Determine target selection (range takes precedence over target if specified)
          target_expr = ""
          if batch_range and batch_range.lower() != "all":
              target_expr = batch_range
          elif batch_target and batch_target.lower() != "all":
              target_expr = batch_target

          if target_expr:
              selected_indices = parse_range_selection(target_expr, len(matrix_items))
              filtered_items = [dict(matrix_items[i - 1]) for i in selected_indices if 1 <= i <= len(matrix_items)]
              if filtered_items:
                  filtered_items[0]["force_no_delay"] = True
                  matrix_items = filtered_items
                  print(f"🎯 Filtered by range/target '{target_expr}': {len(matrix_items)} batch(es) selected.")
              else:
                  print(f"⚠️ Requested range/target '{target_expr}' matched no batches. Running all.")

          matrix_json = json.dumps(matrix_items)
          print(f"Discovered {len(matrix_items)} batch(es) to run:")
          for item in matrix_items:
              print(f"  [{item['index']}] '{item['label']}' -> {item['output']} (Artifact: {item['artifact_name']}, {item['urls_count']} URLs)")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"matrix={matrix_json}\n")
                  f.write(f"total_batches={len(matrix_items)}\n")
          EOF

  merge-batch:
    name: 🎬 Batch ${{ matrix.batch.index }} - ${{ matrix.batch.name }}
    needs: prepare-batches
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.prepare-batches.outputs.matrix) }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Free Runner Disk Space (Maximum NVMe Performance)
        run: |
          echo "========================================================"
          echo "🧹 Freeing runner disk space for large video files..."
          df -h /
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -rf \
            /var/lib/docker \
            /var/lib/containerd \
            /mnt/swapfile \
            /swapfile \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/share/swift \
            /usr/share/rust \
            /usr/local/julia* \
            /usr/share/miniconda \
            /usr/share/az_* \
            /opt/az \
            /opt/google \
            /usr/local/share/chromium \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver \
            /usr/local/share/chromedriver* \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /opt/pipx \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java* \
            /opt/hostedtoolcache/Ruby* \
            /opt/hostedtoolcache/go* \
            /opt/hostedtoolcache/node* \
            /opt/hostedtoolcache/PyPy* || true
          sudo apt-get clean || true
          echo "Available disk space after optimization:"
          df -h /
          echo "========================================================"

      - name: ⏳ Auto-Continuation Cooldown (Wait 5 Minutes Before Resuming)
        if: ${{ inputs.is_continuation == true }}
        run: |
          DELAY="${{ inputs.batch_delay || 300 }}"
          echo "========================================================"
          echo "⏳ AUTO-CONTINUATION COOLDOWN ACTIVE"
          echo "   Waiting $DELAY seconds (5 minutes) before resuming..."
          echo "   Target Batch ${{ matrix.batch.index }}: ${{ matrix.batch.name }}"
          echo "========================================================"
          sleep "$DELAY"

      - name: ⏳ Cooldown Delay (Auto Wait Before Next Video)
        if: ${{ matrix.batch.index > 1 && !matrix.batch.force_no_delay && inputs.is_continuation != true }}
        run: |
          DELAY="${{ inputs.batch_delay || 300 }}"
          echo "========================================================"
          echo "⏳ Cooldown active: waiting $DELAY seconds (5 minutes)"
          echo "   before starting Batch ${{ matrix.batch.index }}: ${{ matrix.batch.name }}"
          echo "========================================================"
          sleep "$DELAY"

      - name: 🎬 Setup FFmpeg & Fast Downloaders (aria2c)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2 curl
          echo "FFmpeg binary: $(which ffmpeg)"
          echo "aria2c binary: $(which aria2c)"
          ffmpeg -version | head -n 2
          aria2c --version | head -n 1

      - name: 🌐 Setup & Connect Cloudflare WARP VPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl gpg lsb-release
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          sudo warp-cli --accept-tos registration new 2>/dev/null || sudo warp-cli --accept-tos register 2>/dev/null || true
          sudo warp-cli --accept-tos mode warp 2>/dev/null || sudo warp-cli --accept-tos set-mode warp 2>/dev/null || true
          
          # Exclude Google Drive & YouTube domains so Google Drive downloads run at 100% direct native gigabit speed
          for domain in drive.google.com drive.usercontent.google.com googleapis.com google.com accounts.google.com docs.google.com youtube.com googlevideo.com; do
            sudo warp-cli --accept-tos tunnel split-tunnel exclude add "$domain" 2>/dev/null || \
            sudo warp-cli --accept-tos split-tunnel exclude add "$domain" 2>/dev/null || true
          done

          sudo warp-cli --accept-tos connect 2>/dev/null || true
          sleep 4
          echo "========================================================"
          echo "🌐 Cloudflare WARP Status & Egress IP:"
          curl -s https://cloudflare.com/cdn-cgi/trace | head -n 6 || curl -s https://ifconfig.me || true
          echo "========================================================"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 💾 Restore Video Segments Checkpoint Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: .video_cache/
          key: video-cache-${{ matrix.batch.name }}-${{ github.run_id }}
          restore-keys: |
            video-cache-${{ matrix.batch.name }}-

      - name: 💾 Restore Video Segments Checkpoint from Artifact (Fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: video-checkpoint-${{ matrix.batch.artifact_name }}
        run: |
          echo "🔍 Checking for fallback checkpoint artifact '$ARTIFACT_NAME'..."
          PREV_RUN_ID=$(gh api "repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=1" --jq '.artifacts[0].workflow_run.id' 2>/dev/null || true)
          if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
            echo "📦 Found checkpoint in workflow run $PREV_RUN_ID. Downloading..."
            mkdir -p .video_cache
            gh run download "$PREV_RUN_ID" -R "$REPO" -n "$ARTIFACT_NAME" --dir .video_cache/ 2>/dev/null || true
            if [ -d ".video_cache" ]; then
              echo "✅ Checkpoint restored successfully from artifact fallback!"
              ls -lhR .video_cache/ || true
            fi
          else
            echo "ℹ️ No previous checkpoint artifact found. Fresh run will begin."
          fi

      - name: 🍪 Setup Google Drive Cookies (Quota Bypass)
        if: ${{ env.GDRIVE_COOKIES != '' }}
        shell: bash
        run: |
          echo "$GDRIVE_COOKIES" > cookies.txt
          echo "✅ Installed Google Drive cookies into cookies.txt for authenticated quota bypass."
        env:
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}

      - name: "🚀 Download & Merge Losslessly (Batch ${{ matrix.batch.index }} - ${{ matrix.batch.name }})"
        id: merge_step
        env:
          INPUT_URLS: ${{ inputs.video_urls }}
          BATCH_INDEX: ${{ matrix.batch.index }}
          OUTPUT_TARGET: ${{ matrix.batch.output }}
          JOIN_MODE: ${{ inputs.join_mode }}
          SORT_ORDER: ${{ inputs.sort_order }}
          PRESET: ${{ inputs.preset || 'ultrafast' }}
          CRF: ${{ inputs.crf || 20 }}
          MAX_RUNTIME: ${{ inputs.max_runtime || 320 }}
          CI: 'true'
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          echo "========================================================"
          echo "🎬 Processing Batch ${{ matrix.batch.index }}: ${{ matrix.batch.name }}"
          echo "🎯 Target File:       $OUTPUT_TARGET"
          echo "⚙️ Join Mode:         $JOIN_MODE"
          echo "🗂️ Sort Order:        $SORT_ORDER"
          echo "⚡ Transcode Preset:  $PRESET (Maximum GitHub Speed)"
          echo "🎨 Transcode CRF:     $CRF"
          echo "⏱️ Max Runtime:       $MAX_RUNTIME minutes safety limit"
          echo "========================================================"
          
          CACHE_DIR=".video_cache/${{ matrix.batch.name }}"
          if [ -f "$INPUT_URLS" ]; then
            python -u video_joiner.py \
              -g "$INPUT_URLS" \
              --batch-index "$BATCH_INDEX" \
              -o "$OUTPUT_TARGET" \
              -m "$JOIN_MODE" \
              --sort "$SORT_ORDER" \
              --preset "$PRESET" \
              --crf "$CRF" \
              --max-runtime "$MAX_RUNTIME" \
              --cache-dir "$CACHE_DIR" \
              -y
          else
            python -u video_joiner.py \
              --urls "$INPUT_URLS" \
              --batch-index "$BATCH_INDEX" \
              -o "$OUTPUT_TARGET" \
              -m "$JOIN_MODE" \
              --sort "$SORT_ORDER" \
              --preset "$PRESET" \
              --crf "$CRF" \
              --max-runtime "$MAX_RUNTIME" \
              --cache-dir "$CACHE_DIR" \
              -y
          fi

      - name: 🧹 Clean Temporary Downloads Before Archiving
        if: always() && steps.merge_step.conclusion != 'skipped'
        run: |
          echo "🧹 Removing raw downloads & temp files to maximize free disk space for cache/artifact..."
          rm -rf downloads/ /tmp/tmp* /tmp/joiner_* 2>/dev/null || true
          df -h /

      - name: 💾 Save Video Segments Checkpoint Cache
        if: always() && steps.merge_step.conclusion != 'skipped' && steps.merge_step.outputs.completed != 'true'
        uses: actions/cache/save@v4
        with:
          path: .video_cache/
          key: video-cache-${{ matrix.batch.name }}-${{ github.run_id }}

      - name: 💾 Save Checkpoint Artifact (Guaranteed Backup if Cache Exceeds Limit)
        if: always() && steps.merge_step.conclusion != 'skipped' && steps.merge_step.outputs.completed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-checkpoint-${{ matrix.batch.artifact_name }}
          path: .video_cache/
          retention-days: 7
          overwrite: true

      - name: 🔄 Auto-Restart Continuation Run (if task not finished within time limit)
        if: always() && steps.merge_step.conclusion != 'skipped' && steps.merge_step.outputs.completed != 'true'
        env:
          INPUT_VIDEO_URLS: ${{ inputs.video_urls }}
          BATCH_INDEX: ${{ matrix.batch.index }}
          TOTAL_BATCHES: ${{ needs.prepare-batches.outputs.total_batches }}
          OUTPUT_FILENAME: ${{ inputs.output_filename }}
          JOIN_MODE: ${{ inputs.join_mode }}
          SORT_ORDER: ${{ inputs.sort_order }}
          PRESET: ${{ inputs.preset || 'ultrafast' }}
          CRF: ${{ inputs.crf || 20 }}
          MAX_RUNTIME: ${{ inputs.max_runtime || 320 }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          UPLOAD_YOUTUBE: ${{ inputs.upload_youtube }}
          YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy || 'private' }}
          YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          BATCH_DELAY: ${{ inputs.batch_delay || 300 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_PAT || secrets.WORKFLOW_TOKEN || secrets.GH_TOKEN || secrets.ACTIONS_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/trigger_continuation.py

      - name: 📤 Upload Merged Video Artifact (${{ matrix.batch.name }})
        if: steps.merge_step.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.batch.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.batch.output }}
            *.mp4
            *timestamps.txt
            merged_video_times_stamp.txt
            !downloads/**
            !.video_cache/**
          if-no-files-found: error
          retention-days: 14

      - name: 📺 Auto-Upload Merged Video to YouTube
        if: ${{ inputs.upload_youtube == true && steps.merge_step.outputs.completed == 'true' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================================"
          echo "📺 Auto-Uploading Merged Video to YouTube with Timestamps..."
          echo "========================================================"
          
          YT_TITLE="${{ inputs.youtube_title }}"
          if [ -z "$YT_TITLE" ]; then
            YT_TITLE="${{ matrix.batch.name }}"
          fi
          
          TARGET_VIDEOS=()
          if [ -f "${{ matrix.batch.output }}" ]; then
            TARGET_VIDEOS+=("${{ matrix.batch.output }}")
          else
            for f in *"Part"*.mp4; do
              if [ -f "$f" ]; then
                TARGET_VIDEOS+=("$f")
              fi
            done
          fi
          
          if [ ${#TARGET_VIDEOS[@]} -gt 0 ]; then
            python scripts/upload.py \
              "${TARGET_VIDEOS[@]}" \
              --title "$YT_TITLE" \
              --privacy "${{ inputs.youtube_privacy || 'private' }}" \
              --timestamps-file "${{ steps.merge_step.outputs.timestamps_file || 'merged_video_times_stamp.txt' }}"
          fi

      - name: 🚀 Publish GitHub Release (Optional)
        if: ${{ inputs.upload_release == true && steps.merge_step.outputs.completed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ matrix.batch.name }}-${{ github.run_id }}
          name: ${{ matrix.batch.name }} - Run ${{ github.run_id }}
          files: |
            ${{ matrix.batch.output }}
            *timestamps.txt
            merged_video_times_stamp.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎬 Lossless Video Joiner Output
            - **Batch Name:** `${{ matrix.batch.name }}`
            - **Original Group Label:** `${{ matrix.batch.label }}`
            - **Output File:** `${{ matrix.batch.output }}`
            - **Workflow Run:** [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Join Mode:** `${{ inputs.join_mode }}`
            - **Transcode Preset:** `${{ inputs.preset || 'veryfast' }}`
